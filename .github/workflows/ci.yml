name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run install-all
      - name: Typecheck server
        run: npm run typecheck
        working-directory: server
      - name: Build client
        run: npm run build
        working-directory: client
